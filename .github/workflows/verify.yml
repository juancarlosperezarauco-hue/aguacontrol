name: Verificar AquaControl

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restaurar paquetes
        run: dotnet restore AquaControl/src/AquaControl.API/AquaControl.API.csproj
      - name: Compilar backend
        run: dotnet build AquaControl/src/AquaControl.API/AquaControl.API.csproj --no-restore --configuration Release
      - name: Verificar JavaScript
        run: |
          for file in AquaControl/Web/*.js; do node --check "$file"; done
          node AquaControl/tests/browser-models.cjs
      - name: Probar cálculo de rutas sin base de datos
        run: dotnet run --project AquaControl/tests/Scope --configuration Release
      - name: Revisar dependencias
        run: dotnet list AquaControl/src/AquaControl.API package --vulnerable --include-transitive
